<section class="documents-table">
    <aside class="header ff-flex-between" aria-label="heading">
        <h3>{{documentList?.length}} {{'document.documents'|translate}}</h3>
        <app-buttons buttonType="stroked" (buttonClicked)="openDocumentDialog()" *ngIf="memberType!==3">
            {{'document.heading'|translate}}
        </app-buttons>
    </aside>

    <section class="ff-table-container w-100">
        <table aria-label="Document tab in company profile">
            <thead>
                <tr>
                    <th class="large-column pointer">
                        {{'document.docName'|translate}}
                    </th>
                    <th class="options-column">

                    </th>
                </tr>
            </thead>
            <tbody>
                <tr class="pointer" *ngFor="let element of documentList;trackBy: trackByFn">
                    <td class="mat-cell large-column">
                        <span class="ff-flex-align-center">
                            <mat-icon>attach_file</mat-icon>{{element?.name}}
                        </span>
                    </td>
                    <td class="mat-cell options-column" (click)="$event.stopPropagation()">
                        <span class="pointer" [matMenuTriggerFor]="beforeMenu">
                            <mat-icon>more_vert</mat-icon>
                        </span>
                        <mat-menu class="mat-menu" #beforeMenu="matMenu" xPosition="before">
                            <button class="text-xs text-blue" mat-menu-item (click)="downloadDoc(element)">
                                {{'button.downloadButton'|translate}}
                            </button>
                            <button class="text-xs text-blue" mat-menu-item (click)="openDocDeleteDialog(element)">
                                {{'button.remove'|translate}}
                            </button>
                        </mat-menu>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="no-data w-100" *ngIf="documentCount === 0" [hidden]="loader">
            {{'document.noDoc'|translate}}
        </div>

        <app-loader [loaderText]="'loaderText.documents'|translate" loaderType="type1" *ngIf="loader"
            class="min-h-300"></app-loader>
    </section>
    <!-- <app-ff-pagination [totalCount]="documentCount" (paginationAction)="paginatorEvent($event)"></app-ff-pagination> -->
    <app-ff-custom-pagination [totalCount]="documentCount" (paginationAction)="paginatorEvent($event)"></app-ff-custom-pagination>
</section>
