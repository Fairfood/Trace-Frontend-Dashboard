<section class="active-filter ff-flex-start" *ngIf="!filterDataLoading">
    <app-ff-filter-box-wrapper class="mx-4" label="Product" [defaultValue]="appliedFilterValues.selectedProduct"
        [filterMasterData]="stocklistFilter?.productData" (selectionChange)="filterStocklist($event, 'product')">
    </app-ff-filter-box-wrapper>
    <app-ff-filter-box-wrapper class="mx-4" label="Supplier" [defaultValue]="appliedFilterValues.selectedSupplier"
        [filterMasterData]="stocklistFilter?.supplierData" (selectionChange)="filterStocklist($event, 'supplier')">
    </app-ff-filter-box-wrapper>
    <app-ff-filter-box-wrapper class="mx-4" label="Claim" [defaultValue]="appliedFilterValues.selectedClaim"
        [filterMasterData]="stocklistFilter?.claimsData" (selectionChange)="filterStocklist($event, 'claim')">
    </app-ff-filter-box-wrapper>

    <app-ff-drop-date label="Created date" class="mx-4" [presetDate]="presetDate" (appliedFilter)="filterByAdditional($event)"
        *ngIf="availableFilters[0].visible"></app-ff-drop-date>

    <app-ff-drop-quantity class="mx-4" *ngIf="availableFilters[1].visible" [defaultValues]="appliedFilterValues"
        (appliedFilter)="filterByAdditional($event)">
    </app-ff-drop-quantity>

    <ng-container *ngIf="availableFilters[2].visible">
        <app-ff-filter-box-wrapper label="Created from" [defaultValue]="appliedFilterValues.createdFrom"
            [filterMasterData]="createdFromList" [hideSearch]="true" customId="createdFrom"
            (selectionChange)="filterStocklist($event, 'createdFrom')">
        </app-ff-filter-box-wrapper>
    </ng-container>

    <app-buttons buttonType="secondary" class="mx-4" buttonSize="medium" [matMenuTriggerFor]="moreFilters" customId="moreFilters">
        + More filters
    </app-buttons>
    <mat-menu class="mat-menu more-filters" #moreFilters="matMenu" xPosition="before">
        <ul>
            <li *ngFor="let item of availableFilters; let i=index">
                <mat-checkbox class="w-100" [checked]="item.visible" id="moreFilter-{{i}}"
                    (change)="showFilter(item)">{{item.name}}</mat-checkbox>
            </li>
        </ul>
    </mat-menu>
</section>
<app-loader loaderText="Loading filters. Please wait" loaderType="type1" *ngIf="filterDataLoading"></app-loader>
